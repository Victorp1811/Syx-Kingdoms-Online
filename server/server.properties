# Syx Kingdoms Online dedicated server
BIND_ADDRESS = 0.0.0.0
PORT = 49720
WORLD_ID = syx-kingdoms-one-world
WORLD_NAME = Syx Kingdoms Persistent World
WORLD_FILE = ../server-data/syx-kingdoms-world-v1.properties

# The base Songs of Syx world is 256x256 tiles. Online is exactly 10x wider and
# 10x taller: a 2560x2560 grid containing 100 base-map-sized sectors.
WORLD_WIDTH = 2560
WORLD_HEIGHT = 2560
CITY_SPACING = 8
# This canonical seed is validated by the server and cannot be changed/rerolled.
WORLD_SEED = syx-kingdoms-canonical-world-v1

# Every client must run this exact game build and this mod alone.
REQUIRED_GAME_VERSION = 0.71.44
REQUIRED_MOD_VERSION = 0.13.0
REQUIRED_MOD_MANIFEST = Syx Kingdoms Online@0.13.0

# Persistent real-time world tick and canonical enforced in-game speed. The
# server rejects any value other than 1.0.
TICK_MILLIS = 1000
FIXED_GAME_SPEED = 1.0

# Persistent player-city capacity for the first 10x shared-world release.
MAX_PLAYERS = 2048
# New kingdoms cannot be attacked for five real days. Launching an army ends
# the attacker's remaining protection immediately.
BEGINNER_PROTECTION_MILLIS = 432000000
HEARTBEAT_TIMEOUT_MILLIS = 15000
SAVE_INTERVAL_MILLIS = 5000
