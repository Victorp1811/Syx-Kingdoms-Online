name: Server tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run protocol/server tests
        shell: pwsh
        run: ./tools/test-server.ps1
      - name: Build dedicated-server container
        run: docker build -t syx-kingdoms-online:test .
